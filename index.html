<script>
  function showError(msg) {
    document.addEventListener('DOMContentLoaded', function () {
      var box = document.getElementById('error-box');
      box.style.display = 'block';
      box.textContent = 'ERROR:\n\n' + msg + '\n\nSacale una foto a este texto y mandaselo a Claude.';
    });
    if (document.readyState !== 'loading') {
      var box = document.getElementById('error-box');
      if (box) {
        box.style.display = 'block';
        box.textContent = 'ERROR:\n\n' + msg + '\n\nSacale una foto a este texto y mandaselo a Claude.';
      }
    }
  }
  window.addEventListener('error', function (e) {
    showError((e.message || 'Error desconocido') + '\n\nArchivo: ' + (e.filename || '?') + '\nLínea: ' + (e.lineno || '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showError('Promise rechazada: ' + (e.reason && e.reason.message ? e.reason.message : JSON.stringify(e.reason)));
  });
</script>

// ---- Storage helpers (using Supabase table "kv_store": key text, value jsonb) ----
async function loadKey(key, fallback) {
  try {
    const { data, error } = await supabaseClient.from('kv_store').select('value').eq('key', key).maybeSingle();
    if (error || !data) return fallback;
    return data.value;
  } catch {
    return fallback;
  }
}
async function saveKey(key, value) {
  try {
    await supabaseClient.from('kv_store').upsert({ key, value });
  } catch (e) {
    console.error('Error guardando', key, e);
  }
}

const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: 'short', year: 'numeric' });
const fmtDateShort = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: 'short' });
const daysBetween = (isoA, isoB) => Math.round((new Date(isoB + 'T00:00:00') - new Date(isoA + 'T00:00:00')) / 86400000);

const EXERCISE_BY_ID = {};
Object.values(EX).forEach((e) => { EXERCISE_BY_ID[e.id] = e; });

const ALL_EXERCISES_FLAT = Object.values(EX);

function defaultSelectedVariants(dayKey) {
  const map = {};
  ROUTINE[dayKey].exercises.forEach((item) => {
    if (item.type === 'slot') map[item.slotId] = item.options[0].id;
  });
  return map;
}

function emptyLogForDay(dayKey, selectedVariants) {
  const log = {};
  ROUTINE[dayKey].exercises.forEach((item) => {
    const exId = item.type === 'fixed' ? item.ex.id : (selectedVariants[item.slotId] || item.options[0].id);
    log[exId] = Array.from({ length: item.sets }, () => ({ weight: '', reps: '' }));
  });
  log[CORE_EXERCISE.id] = Array.from({ length: CORE_EXERCISE.sets }, () => ({ weight: '', reps: '' }));
  return log;
}

function lastPerformance(sessions, exId) {
  for (const s of sessions) {
    if (s.entries[exId]) {
      const filled = s.entries[exId].filter((x) => x.weight !== '' || x.reps !== '');
      if (filled.length > 0) {
        const maxWeight = Math.max(...filled.map((x) => parseFloat(x.weight) || 0));
        const best = filled.find((x) => parseFloat(x.weight) === maxWeight) || filled[0];
        return { date: s.date, weight: best.weight, reps: best.reps };
      }
    }
  }
  return null;
}

function GymTracker() {
  const [sessions, setSessions] = useState(null);
  const [bodyweights, setBodyweights] = useState(null);
  const [view, setView] = useState('log');
  const [selectedDay, setSelectedDay] = useState(1);
  const [date, setDate] = useState(todayISO());
  const [selectedVariants, setSelectedVariants] = useState(defaultSelectedVariants(1));
  const [entries, setEntries] = useState(emptyLogForDay(1, defaultSelectedVariants(1)));
  const [note, setNote] = useState('');
  const [saved, setSaved] = useState(false);
  const [expandedHistoryId, setExpandedHistoryId] = useState(null);
  const [editingSessionId, setEditingSessionId] = useState(null);
  const [progressTab, setProgressTab] = useState('dashboard');
  const [progressExerciseId, setProgressExerciseId] = useState(EX.sentadilla.id);
  const [bwInput, setBwInput] = useState('');
  const [bwDate, setBwDate] = useState(todayISO());
  const [configError, setConfigError] = useState(false);

  useEffect(() => {
    if (SUPABASE_URL.includes('PEGA_ACA') || SUPABASE_ANON_KEY.includes('PEGA_ACA')) {
      setConfigError(true);
      return;
    }
    (async () => {
      const [s, bw] = await Promise.all([loadKey('sessions', []), loadKey('bodyweights', [])]);
      setSessions(s || []);
      setBodyweights(bw || []);
    })();
  }, []);

  useEffect(() => {
    if (editingSessionId) return;
    const defaults = defaultSelectedVariants(selectedDay);
    setSelectedVariants(defaults);
    setEntries(emptyLogForDay(selectedDay, defaults));
    setNote('');
    setSaved(false);
  }, [selectedDay]);

  const updateSet = (exId, setIdx, field, value) => {
    setEntries((prev) => ({
      ...prev,
      [exId]: prev[exId].map((s, i) => (i === setIdx ? { ...s, [field]: value } : s)),
    }));
    setSaved(false);
  };

  const switchVariant = (slotId, newExId, sets) => {
    setSelectedVariants((prev) => {
      const oldExId = prev[slotId];
      setEntries((prevEntries) => {
        const next = { ...prevEntries };
        if (oldExId && oldExId !== newExId) delete next[oldExId];
        if (!next[newExId]) next[newExId] = Array.from({ length: sets }, () => ({ weight: '', reps: '' }));
        return next;
      });
      return { ...prev, [slotId]: newExId };
    });
    setSaved(false);
  };

  const handleSave = async () => {
    const cleaned = {};
    let hasData = false;
    Object.entries(entries).forEach(([exId, sets]) => {
      const filled = sets.filter((s) => s.weight !== '' || s.reps !== '');
      if (filled.length > 0) { cleaned[exId] = sets; hasData = true; }
    });
    if (!hasData) return;

    let next;
    if (editingSessionId) {
      next = (sessions || []).map((s) => s.id === editingSessionId ? { ...s, date, day: selectedDay, entries: cleaned, note: note.trim() } : s);
    } else {
      const existingIdx = (sessions || []).findIndex((s) => s.date === date && s.day === selectedDay);
      if (existingIdx !== -1) {
        next = (sessions || []).map((s, i) => i === existingIdx ? { ...s, entries: cleaned, note: note.trim() || s.note } : s);
      } else {
        next = [{ id: `${date}-${selectedDay}-${Date.now()}`, date, day: selectedDay, entries: cleaned, note: note.trim() }, ...(sessions || [])];
      }
    }
    next = next.sort((a, b) => (a.date < b.date ? 1 : -1));
    setSessions(next);
    await saveKey('sessions', next);
    setSaved(true);
  };

  const handleEditSession = (session) => {
    setEditingSessionId(session.id);
    setDate(session.date);
    setSelectedDay(session.day);
    const defaults = defaultSelectedVariants(session.day);
    ROUTINE[session.day].exercises.forEach((item) => {
      if (item.type === 'slot') {
        const found = item.options.find((o) => session.entries[o.id]);
        if (found) defaults[item.slotId] = found.id;
      }
    });
    setSelectedVariants(defaults);
    const base = emptyLogForDay(session.day, defaults);
    Object.entries(session.entries).forEach(([exId, sets]) => {
      base[exId] = sets.map((s) => ({ weight: s.weight ?? '', reps: s.reps ?? '' }));
    });
    setEntries(base);
    setNote(session.note || '');
    setSaved(false);
    setView('log');
  };

  const handleDeleteSession = async (sessionId) => {
    const next = (sessions || []).filter((s) => s.id !== sessionId);
    setSessions(next);
    await saveKey('sessions', next);
    if (editingSessionId === sessionId) {
      setEditingSessionId(null);
      const defaults = defaultSelectedVariants(selectedDay);
      setSelectedVariants(defaults);
      setEntries(emptyLogForDay(selectedDay, defaults));
      setNote('');
    }
  };

  const handleCancelEdit = () => {
    setEditingSessionId(null);
    const defaults = defaultSelectedVariants(selectedDay);
    setSelectedVariants(defaults);
    setEntries(emptyLogForDay(selectedDay, defaults));
    setNote('');
    setSaved(false);
  };

  const handleSaveBodyweight = async () => {
    const val = parseFloat(bwInput);
    if (!val || val <= 0) return;
    const filtered = (bodyweights || []).filter((b) => b.date !== bwDate);
    const next = [...filtered, { date: bwDate, weight: val }].sort((a, b) => (a.date < b.date ? -1 : 1));
    setBodyweights(next);
    await saveKey('bodyweights', next);
    setBwInput('');
  };

  const progressData = (sessions || [])
    .filter((s) => s.entries[progressExerciseId])
    .map((s) => ({ date: s.date, maxWeight: Math.max(0, ...s.entries[progressExerciseId].map((x) => parseFloat(x.weight) || 0)) }))
    .filter((p) => p.maxWeight > 0)
    .sort((a, b) => (a.date > b.date ? 1 : -1));

  if (configError) {
    return (
      <div style={styles.loadingScreen}>
        <div style={{ ...styles.loadingText, maxWidth: 320, textAlign: 'center', lineHeight: 1.6 }}>
          FALTA CONFIGURAR SUPABASE.<br/>Editá el archivo index.html y pegá tu URL y ANON KEY donde dice "PEGA_ACA".
        </div>
      </div>
    );
  }

  if (sessions === null || bodyweights === null) {
    return <div style={styles.loadingScreen}><div style={styles.loadingText}>CARGANDO</div></div>;
  }

  return (
    <div style={styles.app}>
      <header style={styles.header}>
        <div>
          <div style={styles.kicker}>REGISTRO DE ENTRENAMIENTO</div>
          <h1 style={styles.title}>BITÁCORA</h1>
        </div>
        <div style={styles.headerRule} />
      </header>

      <nav style={styles.nav}>
        <NavButton active={view === 'log'} onClick={() => setView('log')} label="Registrar" />
        <NavButton active={view === 'history'} onClick={() => setView('history')} label="Historial" />
        <NavButton active={view === 'progress'} onClick={() => setView('progress')} label="Progreso" />
        <NavButton active={view === 'guide'} onClick={() => setView('guide')} label="Guía" />
      </nav>

      {view === 'log' && (
        <LogView date={date} setDate={setDate} selectedDay={selectedDay} setSelectedDay={setSelectedDay}
          entries={entries} updateSet={updateSet} note={note} setNote={setNote} handleSave={handleSave}
          saved={saved} sessions={sessions} editingSessionId={editingSessionId} handleCancelEdit={handleCancelEdit}
          selectedVariants={selectedVariants} switchVariant={switchVariant} />
      )}
      {view === 'history' && (
        <HistoryView sessions={sessions} expandedHistoryId={expandedHistoryId}
          setExpandedHistoryId={setExpandedHistoryId} handleEditSession={handleEditSession} handleDeleteSession={handleDeleteSession} />
      )}
      {view === 'progress' && (
        <ProgressView progressTab={progressTab} setProgressTab={setProgressTab}
          progressExerciseId={progressExerciseId} setProgressExerciseId={setProgressExerciseId} progressData={progressData}
          sessions={sessions} bodyweights={bodyweights} bwInput={bwInput} setBwInput={setBwInput}
          bwDate={bwDate} setBwDate={setBwDate} handleSaveBodyweight={handleSaveBodyweight} />
      )}
      {view === 'guide' && <GuideView />}
    </div>
  );
}

function NavButton({ active, onClick, label }) {
  return <button onClick={onClick} style={{ ...styles.navButton, ...(active ? styles.navButtonActive : {}) }}>{label}</button>;
}

    <div style={styles.exInfoRow}>
      <a href={ex.video} target="_blank" rel="noopener noreferrer" style={styles.exVideoLink}>▶ VER TÉCNICA (VIDEO)</a>
      {ex.tip && <div style={styles.exTip}>{ex.tip}</div>}
    </div>

}

  return (
    <div style={styles.setsGrid}>
      <div style={styles.setsGridHeader}>
        <span></span><span style={styles.setsGridHeaderCell}>KG</span><span style={styles.setsGridHeaderCell}>REPS</span>
      </div>
      {entries[ex.id]?.map((set, setIdx) => (
        <div key={setIdx} style={styles.setRow}>
          <span style={styles.setLabel}>Serie {setIdx + 1}</span>
          <input type="number" inputMode="decimal" value={set.weight} onChange={(e) => updateSet(ex.id, setIdx, 'weight', e.target.value)} placeholder="—" style={styles.setInput} />
          <input type="number" inputMode="numeric" value={set.reps} onChange={(e) => updateSet(ex.id, setIdx, 'reps', e.target.value)} placeholder="—" style={styles.setInput} />
        </div>
      ))}
    </div>
  );
}

function LogView({ date, setDate, selectedDay, setSelectedDay, entries, updateSet, note, setNote, handleSave, saved, sessions, editingSessionId, handleCancelEdit, selectedVariants, switchVariant }) {
  const day = ROUTINE[selectedDay];
  return (
    <div style={styles.section}>
      {editingSessionId && (
        <div style={styles.editBanner}>
          <span>EDITANDO SESIÓN EXISTENTE</span>
          <button onClick={handleCancelEdit} style={styles.editBannerCancel}>Cancelar</button>
        </div>
      )}
      <div style={styles.controlsRow}>
        <div style={styles.dayTabs}>
          {[1, 2, 3].map((d) => (
            <button key={d} disabled={!!editingSessionId} onClick={() => setSelectedDay(d)}
              style={{ ...styles.dayTab, ...(selectedDay === d ? styles.dayTabActive : {}), ...(editingSessionId ? styles.dayTabDisabled : {}) }}>
              {ROUTINE[d].label}
            </button>
          ))}
        </div>
        <input type="date" value={date} disabled={!!editingSessionId} onChange={(e) => setDate(e.target.value)} style={styles.dateInput} />
      </div>

      <div style={styles.exerciseList}>
        {day.exercises.map((item, idx) => {
          if (item.type === 'fixed') {
            const ex = item.ex;
            const last = lastPerformance(sessions, ex.id);
            return (
              <div key={ex.id} style={styles.exerciseCard}>
                <div style={styles.exerciseHeader}>
                  <span style={styles.exerciseNum}>{String(idx + 1).padStart(2, '0')}</span>

function DashboardTab({ sessions }) {
  if (sessions.length === 0) {
    return <div style={styles.emptyState}><div style={styles.emptyTitle}>SIN DATOS</div><div style={styles.emptyText}>Registrá sesiones para ver tu resumen acá.</div></div>;
  }
  const totalSessions = sessions.length;
  const today = todayISO();
  const last7 = sessions.filter((s) => { const d = daysBetween(s.date, today); return d <= 7 && d >= 0; }).length;
  let totalSets = 0;
  sessions.forEach((s) => Object.values(s.entries).forEach((sets) => { totalSets += sets.filter((x) => x.weight !== '' || x.reps !== '').length; }));
  const lastSession = sessions[0];
  const daysSinceLast = daysBetween(lastSession.date, today);

  let streakWeeks = 0;
  {
    const sorted = [...sessions].map((s) => s.date).sort((a, b) => (a < b ? 1 : -1));
    let cursor = new Date(today + 'T00:00:00');
    for (let w = 0; w < 52; w++) {
      const weekStart = new Date(cursor); weekStart.setDate(weekStart.getDate() - 7);
      const hasSession = sorted.some((d) => { const dd = new Date(d + 'T00:00:00'); return dd > weekStart && dd <= cursor; });
      if (hasSession) { streakWeeks++; cursor = weekStart; } else break;
    }
  }

  return (
    <div style={styles.dashGrid}>
      <div style={styles.dashCard}><span style={styles.dashValue}>{totalSessions}</span><span style={styles.dashLabel}>SESIONES TOTALES</span></div>
      <div style={styles.dashCard}><span style={styles.dashValue}>{last7}</span><span style={styles.dashLabel}>ÚLTIMOS 7 DÍAS</span></div>
      <div style={styles.dashCard}><span style={styles.dashValue}>{streakWeeks}</span><span style={styles.dashLabel}>SEMANAS SEGUIDAS</span></div>
      <div style={styles.dashCard}><span style={styles.dashValueSmall}>{totalSets}</span><span style={styles.dashLabel}>SERIES REGISTRADAS</span></div>
      <div style={{ ...styles.dashCard, gridColumn: '1 / -1' }}>
        <span style={styles.dashLabel}>ÚLTIMA SESIÓN</span>
        <span style={styles.dashValueSmall}>{ROUTINE[lastSession.day].label} · {fmtDate(lastSession.date)}{daysSinceLast > 0 && <span style={styles.dashSubtle}> ({daysSinceLast} día{daysSinceLast !== 1 ? 's' : ''} atrás)</span>}</span>
      </div>
    </div>
  );
}

function BarChartCard({ data, unit, label }) {
  const values = data.map((p) => p.value);
  const maxW = Math.max(1, ...values);
  const minW = Math.min(...values, maxW);
  const range = maxW - minW || 1;
  return (
    <div style={styles.chartCard}>
      <div style={styles.chartHeaderRow}><span style={styles.chartLabel}>{label}</span><span style={styles.chartUnit}>{unit}</span></div>
      <div style={styles.chartArea}>
        {data.map((p, i) => {
          const heightPct = ((p.value - minW) / range) * 70 + 20;
          return (
            <div key={i} style={styles.chartBarWrap}>
              <span style={styles.chartValue}>{p.value}</span>
              <div style={{ ...styles.chartBar, height: `${heightPct}%` }} />
              <span style={styles.chartDate}>{fmtDateShort(p.date)}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

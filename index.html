<script>
  function showError(msg) {
    document.addEventListener('DOMContentLoaded', function () {
      var box = document.getElementById('error-box');
      box.style.display = 'block';
      box.textContent = 'ERROR:\n\n' + msg + '\n\nSacale una foto a este texto y mandaselo a Claude.';
    });
    if (document.readyState !== 'loading') {
      var box = document.getElementById('error-box');
      if (box) {
        box.style.display = 'block';
        box.textContent = 'ERROR:\n\n' + msg + '\n\nSacale una foto a este texto y mandaselo a Claude.';
      }
    }
  }
  window.addEventListener('error', function (e) {
    showError((e.message || 'Error desconocido') + '\n\nArchivo: ' + (e.filename || '?') + '\nLĂ­nea: ' + (e.lineno || '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showError('Promise rechazada: ' + (e.reason && e.reason.message ? e.reason.message : JSON.stringify(e.reason)));
  });
</script>

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---- Storage helpers (using Supabase table "kv_store": key text, value jsonb) ----
async function loadKey(key, fallback) {
  try {
    const { data, error } = await supabase.from('kv_store').select('value').eq('key', key).maybeSingle();
    if (error || !data) return fallback;
    return data.value;
  } catch {
    return fallback;
  }
}
async function saveKey(key, value) {
  try {
    await supabase.from('kv_store').upsert({ key, value });
  } catch (e) {
    console.error('Error guardando', key, e);
  }
}

// ---- Routine definition ----
const ROUTINE = {
  1: { label: 'DĂ­a 1', exercises: [
    { id: 'd1-sentadilla', name: 'Sentadilla', sets: 4, repRange: '6-8' },
    { id: 'd1-press-banca', name: 'Press banca', sets: 3, repRange: '6-8' },
    { id: 'd1-remo', name: 'Remo con barra/mancuerna', sets: 3, repRange: '8-10' },
    { id: 'd1-press-militar', name: 'Press militar', sets: 2, repRange: '8-10' },
    { id: 'd1-curl', name: 'Curl bĂ­ceps', sets: 2, repRange: '10-12' },
  ]},
  2: { label: 'DĂ­a 2', exercises: [
    { id: 'd2-pesomuerto', name: 'Peso muerto (o rumano)', sets: 3, repRange: '6-8' },
    { id: 'd2-press-inclinado', name: 'Press inclinado / fondos asistidos', sets: 3, repRange: '6-10' },
    { id: 'd2-dominadas', name: 'Dominadas asistidas / jalĂłn al pecho', sets: 3, repRange: '8-10' },
    { id: 'd2-zancadas', name: 'Zancadas o prensa', sets: 2, repRange: '10-12' },
    { id: 'd2-triceps', name: 'TrĂ­ceps en polea / fondos asistidos', sets: 2, repRange: '10-12' },
  ]},
  3: { label: 'DĂ­a 3', exercises: [
    { id: 'd3-sentadilla-v', name: 'Sentadilla o prensa (variante)', sets: 3, repRange: '8-10' },
    { id: 'd3-press-banca', name: 'Press banca o inclinado', sets: 3, repRange: '8-10' },
    { id: 'd3-remo', name: 'Remo en mĂˇquina o TRX', sets: 3, repRange: '8-10' },
    { id: 'd3-press-militar', name: 'Press militar mancuernas', sets: 2, repRange: '10-12' },
    { id: 'd3-super', name: 'Superserie: curl + trĂ­ceps', sets: 2, repRange: '12' },
  ]},
};
const CORE_EXERCISE = { id: 'core-opcional', name: 'Core (abdominales / plancha)', sets: 3, repRange: 'a elecciĂłn' };

const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: 'short', year: 'numeric' });
const fmtDateShort = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: 'short' });
const daysBetween = (isoA, isoB) => Math.round((new Date(isoB + 'T00:00:00') - new Date(isoA + 'T00:00:00')) / 86400000);

function emptyLogForDay(dayKey) {
  const log = {};
  [...ROUTINE[dayKey].exercises, CORE_EXERCISE].forEach((ex) => {
    log[ex.id] = Array.from({ length: ex.sets }, () => ({ weight: '', reps: '' }));
  });
  return log;
}

function lastPerformance(sessions, exId) {
  for (const s of sessions) {
    if (s.entries[exId]) {
      const filled = s.entries[exId].filter((x) => x.weight !== '' || x.reps !== '');
      if (filled.length > 0) {
        const maxWeight = Math.max(...filled.map((x) => parseFloat(x.weight) || 0));
        const best = filled.find((x) => parseFloat(x.weight) === maxWeight) || filled[0];
        return { date: s.date, weight: best.weight, reps: best.reps };
      }
    }
  }
  return null;
}

function GymTracker() {
  const [sessions, setSessions] = useState(null);
  const [bodyweights, setBodyweights] = useState(null);
  const [view, setView] = useState('log');
  const [selectedDay, setSelectedDay] = useState(1);
  const [date, setDate] = useState(todayISO());
  const [entries, setEntries] = useState(emptyLogForDay(1));
  const [note, setNote] = useState('');
  const [saved, setSaved] = useState(false);
  const [expandedHistoryId, setExpandedHistoryId] = useState(null);
  const [editingSessionId, setEditingSessionId] = useState(null);
  const [progressTab, setProgressTab] = useState('dashboard');
  const [progressExerciseId, setProgressExerciseId] = useState('d1-sentadilla');
  const [bwInput, setBwInput] = useState('');
  const [bwDate, setBwDate] = useState(todayISO());
  const [configError, setConfigError] = useState(false);

  useEffect(() => {
    if (SUPABASE_URL.includes('PEGA_ACA') || SUPABASE_ANON_KEY.includes('PEGA_ACA')) {
      setConfigError(true);
      return;
    }
    (async () => {
      const [s, bw] = await Promise.all([loadKey('sessions', []), loadKey('bodyweights', [])]);
      setSessions(s || []);
      setBodyweights(bw || []);
    })();
  }, []);

  useEffect(() => {
    if (editingSessionId) return;
    setEntries(emptyLogForDay(selectedDay));
    setNote('');
    setSaved(false);
  }, [selectedDay]);

  const updateSet = (exId, setIdx, field, value) => {
    setEntries((prev) => ({ ...prev, [exId]: prev[exId].map((s, i) => (i === setIdx ? { ...s, [field]: value } : s)) }));
    setSaved(false);
  };

  const handleSave = async () => {
    const cleaned = {};
    let hasData = false;
    Object.entries(entries).forEach(([exId, sets]) => {
      const filled = sets.filter((s) => s.weight !== '' || s.reps !== '');
      if (filled.length > 0) { cleaned[exId] = sets; hasData = true; }
    });
    if (!hasData) return;

    let next;
    if (editingSessionId) {
      next = (sessions || []).map((s) => s.id === editingSessionId ? { ...s, date, day: selectedDay, entries: cleaned, note: note.trim() } : s);
    } else {
      const existingIdx = (sessions || []).findIndex((s) => s.date === date && s.day === selectedDay);
      if (existingIdx !== -1) {
        next = (sessions || []).map((s, i) => i === existingIdx ? { ...s, entries: cleaned, note: note.trim() || s.note } : s);
      } else {
        next = [{ id: `${date}-${selectedDay}-${Date.now()}`, date, day: selectedDay, entries: cleaned, note: note.trim() }, ...(sessions || [])];
      }
    }
    next = next.sort((a, b) => (a.date < b.date ? 1 : -1));
    setSessions(next);
    await saveKey('sessions', next);
    setSaved(true);
  };

  const handleEditSession = (session) => {
    setEditingSessionId(session.id);
    setDate(session.date);
    setSelectedDay(session.day);
    const base = emptyLogForDay(session.day);
    Object.entries(session.entries).forEach(([exId, sets]) => {
      if (base[exId]) base[exId] = sets.map((s) => ({ weight: s.weight ?? '', reps: s.reps ?? '' }));
    });
    setEntries(base);
    setNote(session.note || '');
    setSaved(false);
    setView('log');
  };

  const handleDeleteSession = async (sessionId) => {
    const next = (sessions || []).filter((s) => s.id !== sessionId);
    setSessions(next);
    await saveKey('sessions', next);
    if (editingSessionId === sessionId) { setEditingSessionId(null); setEntries(emptyLogForDay(selectedDay)); setNote(''); }
  };

  const handleCancelEdit = () => {
    setEditingSessionId(null);
    setEntries(emptyLogForDay(selectedDay));
    setNote('');
    setSaved(false);
  };

  const handleSaveBodyweight = async () => {
    const val = parseFloat(bwInput);
    if (!val || val <= 0) return;
    const filtered = (bodyweights || []).filter((b) => b.date !== bwDate);
    const next = [...filtered, { date: bwDate, weight: val }].sort((a, b) => (a.date < b.date ? -1 : 1));
    setBodyweights(next);
    await saveKey('bodyweights', next);
    setBwInput('');
  };

  const allExercises = Object.values(ROUTINE).flatMap((d) => d.exercises);
  const exerciseById = Object.fromEntries([...allExercises, CORE_EXERCISE].map((e) => [e.id, e]));

  const progressData = (sessions || [])
    .filter((s) => s.entries[progressExerciseId])
    .map((s) => ({ date: s.date, maxWeight: Math.max(0, ...s.entries[progressExerciseId].map((x) => parseFloat(x.weight) || 0)) }))
    .filter((p) => p.maxWeight > 0)
    .sort((a, b) => (a.date > b.date ? 1 : -1));

  if (configError) {
    return (
      <div style={styles.loadingScreen}>
        <div style={{ ...styles.loadingText, maxWidth: 320, textAlign: 'center', lineHeight: 1.6 }}>
          FALTA CONFIGURAR SUPABASE.<br/>EditĂˇ el archivo index.html y pegĂˇ tu URL y ANON KEY donde dice "PEGA_ACA".
        </div>
      </div>
    );
  }

  if (sessions === null || bodyweights === null) {
    return <div style={styles.loadingScreen}><div style={styles.loadingText}>CARGANDO</div></div>;
  }

  return (
    <div style={styles.app}>
      <header style={styles.header}>
        <div>
          <div style={styles.kicker}>REGISTRO DE ENTRENAMIENTO</div>
          <h1 style={styles.title}>BITĂ�CORA</h1>
        </div>
        <div style={styles.headerRule} />
      </header>

      <nav style={styles.nav}>
        <NavButton active={view === 'log'} onClick={() => setView('log')} label="Registrar" />
        <NavButton active={view === 'history'} onClick={() => setView('history')} label="Historial" />
        <NavButton active={view === 'progress'} onClick={() => setView('progress')} label="Progreso" />
        <NavButton active={view === 'guide'} onClick={() => setView('guide')} label="GuĂ­a" />
      </nav>

      {view === 'log' && (
        <LogView date={date} setDate={setDate} selectedDay={selectedDay} setSelectedDay={setSelectedDay}
          entries={entries} updateSet={updateSet} note={note} setNote={setNote} handleSave={handleSave}
          saved={saved} sessions={sessions} editingSessionId={editingSessionId} handleCancelEdit={handleCancelEdit} />
      )}
      {view === 'history' && (
        <HistoryView sessions={sessions} exerciseById={exerciseById} expandedHistoryId={expandedHistoryId}
          setExpandedHistoryId={setExpandedHistoryId} handleEditSession={handleEditSession} handleDeleteSession={handleDeleteSession} />
      )}
      {view === 'progress' && (
        <ProgressView allExercises={allExercises} progressTab={progressTab} setProgressTab={setProgressTab}
          progressExerciseId={progressExerciseId} setProgressExerciseId={setProgressExerciseId} progressData={progressData}
          sessions={sessions} bodyweights={bodyweights} bwInput={bwInput} setBwInput={setBwInput}
          bwDate={bwDate} setBwDate={setBwDate} handleSaveBodyweight={handleSaveBodyweight} />
      )}
      {view === 'guide' && <GuideView />}
    </div>
  );
}

function NavButton({ active, onClick, label }) {
  return <button onClick={onClick} style={{ ...styles.navButton, ...(active ? styles.navButtonActive : {}) }}>{label}</button>;
}

function LogView({ date, setDate, selectedDay, setSelectedDay, entries, updateSet, note, setNote, handleSave, saved, sessions, editingSessionId, handleCancelEdit }) {
  const day = ROUTINE[selectedDay];
  return (
    <div style={styles.section}>
      {editingSessionId && (
        <div style={styles.editBanner}>
          <span>EDITANDO SESIĂ“N EXISTENTE</span>
          <button onClick={handleCancelEdit} style={styles.editBannerCancel}>Cancelar</button>
        </div>
      )}
      <div style={styles.controlsRow}>
        <div style={styles.dayTabs}>
          {[1, 2, 3].map((d) => (
            <button key={d} disabled={!!editingSessionId} onClick={() => setSelectedDay(d)}
              style={{ ...styles.dayTab, ...(selectedDay === d ? styles.dayTabActive : {}), ...(editingSessionId ? styles.dayTabDisabled : {}) }}>
              {ROUTINE[d].label}
            </button>
          ))}
        </div>
        <input type="date" value={date} disabled={!!editingSessionId} onChange={(e) => setDate(e.target.value)} style={styles.dateInput} />
      </div>

      <div style={styles.exerciseList}>
        {day.exercises.map((ex, idx) => {
          const last = lastPerformance(sessions, ex.id);
          return (
            <div key={ex.id} style={styles.exerciseCard}>
              <div style={styles.exerciseHeader}>
                <span style={styles.exerciseNum}>{String(idx + 1).padStart(2, '0')}</span>
                <div style={{ flex: 1 }}>
                  <div style={styles.exerciseName}>{ex.name}</div>
                  <div style={styles.exerciseMeta}>{ex.sets} series Â· {ex.repRange} reps</div>
                </div>
              </div>
              {last && (
                <div style={styles.lastPerf}>
                  <span style={styles.lastPerfLabel}>ĂšLTIMA VEZ</span>
                  <span style={styles.lastPerfValue}>{last.weight}kg Ă— {last.reps} Â· {fmtDateShort(last.date)}</span>
                </div>
              )}
              <div style={styles.setsGrid}>
                <div style={styles.setsGridHeader}>
                  <span></span><span style={styles.setsGridHeaderCell}>KG</span><span style={styles.setsGridHeaderCell}>REPS</span>
                </div>
                {entries[ex.id]?.map((set, setIdx) => (
                  <div key={setIdx} style={styles.setRow}>
                    <span style={styles.setLabel}>Serie {setIdx + 1}</span>
                    <input type="number" inputMode="decimal" value={set.weight} onChange={(e) => updateSet(ex.id, setIdx, 'weight', e.target.value)} placeholder="â€”" style={styles.setInput} />
                    <input type="number" inputMode="numeric" value={set.reps} onChange={(e) => updateSet(ex.id, setIdx, 'reps', e.target.value)} placeholder="â€”" style={styles.setInput} />
                  </div>
                ))}
              </div>
            </div>
          );
        })}

        <div style={{ ...styles.exerciseCard, ...styles.coreCard }}>
          <div style={styles.exerciseHeader}>
            <span style={styles.exerciseNum}>+</span>
            <div style={{ flex: 1 }}>
              <div style={styles.exerciseName}>{CORE_EXERCISE.name}</div>
              <div style={styles.exerciseMeta}>opcional Â· series x reps o segundos</div>
            </div>
          </div>
          <div style={styles.setsGrid}>
            <div style={styles.setsGridHeader}>
              <span></span><span style={styles.setsGridHeaderCell}>EJERCICIO</span><span style={styles.setsGridHeaderCell}>REPS/SEG</span>
            </div>
            {entries[CORE_EXERCISE.id]?.map((set, setIdx) => (
              <div key={setIdx} style={styles.setRow}>
                <span style={styles.setLabel}>Serie {setIdx + 1}</span>
                <input type="text" value={set.weight} onChange={(e) => updateSet(CORE_EXERCISE.id, setIdx, 'weight', e.target.value)} placeholder="ej: plancha" style={styles.setInput} />
                <input type="text" value={set.reps} onChange={(e) => updateSet(CORE_EXERCISE.id, setIdx, 'reps', e.target.value)} placeholder="ej: 30s" style={styles.setInput} />
              </div>
            ))}
          </div>
        </div>
      </div>

      <div style={styles.noteCard}>
        <span style={styles.noteLabel}>NOTA DE LA SESIĂ“N (opcional)</span>
        <textarea value={note} onChange={(e) => setNote(e.target.value)} placeholder="Ej: me costĂł la Ăşltima serie, subir peso prĂłxima vez..." style={styles.noteInput} rows={2} />
      </div>

      <button onClick={handleSave} style={styles.saveButton}>
        {saved ? `âś“ ${editingSessionId ? 'CAMBIOS GUARDADOS' : 'GUARDADO'}` : (editingSessionId ? 'GUARDAR CAMBIOS' : 'GUARDAR SESIĂ“N')}
      </button>
    </div>
  );
}

function HistoryView({ sessions, exerciseById, expandedHistoryId, setExpandedHistoryId, handleEditSession, handleDeleteSession }) {
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  if (sessions.length === 0) {
    return <div style={styles.emptyState}><div style={styles.emptyTitle}>SIN REGISTROS</div><div style={styles.emptyText}>RegistrĂˇ tu primera sesiĂłn para verla acĂˇ.</div></div>;
  }
  return (
    <div style={styles.section}>
      <div style={styles.historyList}>
        {sessions.map((s) => {
          const isOpen = expandedHistoryId === s.id;
          const exCount = Object.keys(s.entries).length;
          const isConfirming = confirmDeleteId === s.id;
          return (
            <div key={s.id} style={styles.historyCard}>
              <button style={styles.historyCardHeader} onClick={() => setExpandedHistoryId(isOpen ? null : s.id)}>
                <div style={styles.historyCardLeft}>
                  <span style={styles.historyDayTag}>{ROUTINE[s.day].label}</span>
                  <span style={styles.historyDate}>{fmtDate(s.date)}</span>
                </div>
                <div style={styles.historyCardRight}>
                  <span style={styles.historyExCount}>{exCount} ejerc.</span>
                  <span>{isOpen ? 'â–˛' : 'â–Ľ'}</span>
                </div>
              </button>
              {isOpen && (
                <div style={styles.historyDetail}>
                  {Object.entries(s.entries).map(([exId, sets]) => (
                    <div key={exId} style={styles.historyExRow}>
                      <div style={styles.historyExName}>{exerciseById[exId]?.name || exId}</div>
                      <div style={styles.historySets}>
                        {sets.filter((x) => x.weight !== '' || x.reps !== '').map((x, i) => (
                          <span key={i} style={styles.historySetChip}>{x.weight || 'â€”'}{exId === 'core-opcional' ? '' : 'kg'} Ă— {x.reps || 'â€”'}</span>
                        ))}
                      </div>
                    </div>
                  ))}
                  {s.note && (
                    <div style={styles.historyNote}>
                      <span style={styles.historyNoteLabel}>NOTA</span>
                      <span style={styles.historyNoteText}>{s.note}</span>
                    </div>
                  )}
                  <div style={styles.historyActions}>
                    {!isConfirming ? (
                      <>
                        <button style={styles.historyActionEdit} onClick={() => handleEditSession(s)}>Editar</button>
                        <button style={styles.historyActionDelete} onClick={() => setConfirmDeleteId(s.id)}>Eliminar</button>
                      </>
                    ) : (
                      <>
                        <span style={styles.historyConfirmText}>ÂżEliminar esta sesiĂłn?</span>
                        <button style={styles.historyActionDelete} onClick={() => { handleDeleteSession(s.id); setConfirmDeleteId(null); }}>SĂ­, eliminar</button>
                        <button style={styles.historyActionEdit} onClick={() => setConfirmDeleteId(null)}>Cancelar</button>
                      </>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ProgressView({ allExercises, progressTab, setProgressTab, progressExerciseId, setProgressExerciseId, progressData, sessions, bodyweights, bwInput, setBwInput, bwDate, setBwDate, handleSaveBodyweight }) {
  return (
    <div style={styles.section}>
      <div style={styles.subTabs}>
        <button onClick={() => setProgressTab('dashboard')} style={{ ...styles.subTab, ...(progressTab === 'dashboard' ? styles.subTabActive : {}) }}>Resumen</button>
        <button onClick={() => setProgressTab('exercise')} style={{ ...styles.subTab, ...(progressTab === 'exercise' ? styles.subTabActive : {}) }}>Ejercicio</button>
        <button onClick={() => setProgressTab('bodyweight')} style={{ ...styles.subTab, ...(progressTab === 'bodyweight' ? styles.subTabActive : {}) }}>Peso corporal</button>
      </div>

      {progressTab === 'dashboard' && <DashboardTab sessions={sessions} />}

      {progressTab === 'exercise' && (
        <>
          <select value={progressExerciseId} onChange={(e) => setProgressExerciseId(e.target.value)} style={styles.exerciseSelect}>
            {allExercises.map((ex) => <option key={ex.id} value={ex.id}>{ex.name}</option>)}
          </select>
          {progressData.length === 0 ? (

          )}
        </>
      )}

      {progressTab === 'bodyweight' && (
        <BodyweightTab bodyweights={bodyweights} bwInput={bwInput} setBwInput={setBwInput} bwDate={bwDate} setBwDate={setBwDate} handleSaveBodyweight={handleSaveBodyweight} />

}

function DashboardTab({ sessions }) {
  if (sessions.length === 0) {
    return <div style={styles.emptyState}><div style={styles.emptyTitle}>SIN DATOS</div><div style={styles.emptyText}>RegistrĂˇ sesiones para ver tu resumen acĂˇ.</div></div>;
  }
  const totalSessions = sessions.length;
  const today = todayISO();
  const last7 = sessions.filter((s) => { const d = daysBetween(s.date, today); return d <= 7 && d >= 0; }).length;
  let totalSets = 0;
  sessions.forEach((s) => Object.values(s.entries).forEach((sets) => { totalSets += sets.filter((x) => x.weight !== '' || x.reps !== '').length; }));
  const lastSession = sessions[0];
  const daysSinceLast = daysBetween(lastSession.date, today);

  let streakWeeks = 0;
  {
    const sorted = [...sessions].map((s) => s.date).sort((a, b) => (a < b ? 1 : -1));
    let cursor = new Date(today + 'T00:00:00');
    for (let w = 0; w < 52; w++) {
      const weekStart = new Date(cursor); weekStart.setDate(weekStart.getDate() - 7);
      const hasSession = sorted.some((d) => { const dd = new Date(d + 'T00:00:00'); return dd > weekStart && dd <= cursor; });
      if (hasSession) { streakWeeks++; cursor = weekStart; } else break;
    }
  }

  return (
    <div style={styles.dashGrid}>
      <div style={styles.dashCard}><span style={styles.dashValue}>{totalSessions}</span><span style={styles.dashLabel}>SESIONES TOTALES</span></div>
      <div style={styles.dashCard}><span style={styles.dashValue}>{last7}</span><span style={styles.dashLabel}>ĂšLTIMOS 7 DĂŤAS</span></div>
      <div style={styles.dashCard}><span style={styles.dashValue}>{streakWeeks}</span><span style={styles.dashLabel}>SEMANAS SEGUIDAS</span></div>
      <div style={styles.dashCard}><span style={styles.dashValueSmall}>{totalSets}</span><span style={styles.dashLabel}>SERIES REGISTRADAS</span></div>
      <div style={{ ...styles.dashCard, gridColumn: '1 / -1' }}>
        <span style={styles.dashLabel}>ĂšLTIMA SESIĂ“N</span>
        <span style={styles.dashValueSmall}>{ROUTINE[lastSession.day].label} Â· {fmtDate(lastSession.date)}{daysSinceLast > 0 && <span style={styles.dashSubtle}> ({daysSinceLast} dĂ­a{daysSinceLast !== 1 ? 's' : ''} atrĂˇs)</span>}</span>
      </div>
    </div>
  );
}

function BodyweightTab({ bodyweights, bwInput, setBwInput, bwDate, setBwDate, handleSaveBodyweight }) {
  const chartData = bodyweights.map((b) => ({ date: b.date, value: b.weight }));
  const latest = bodyweights[bodyweights.length - 1];
  const first = bodyweights[0];
  const delta = latest && first ? (latest.weight - first.weight).toFixed(1) : null;
  return (
    <div>
      <div style={styles.bwInputCard}>
        <div style={styles.bwInputRow}>
          <input type="date" value={bwDate} onChange={(e) => setBwDate(e.target.value)} style={{ ...styles.dateInput, flex: 1 }} />
          <input type="number" inputMode="decimal" value={bwInput} onChange={(e) => setBwInput(e.target.value)} placeholder="Peso (kg)" style={styles.bwWeightInput} />
        </div>
        <button onClick={handleSaveBodyweight} style={styles.bwSaveButton}>REGISTRAR PESO</button>
      </div>
      {bodyweights.length === 0 ? (
        <div style={styles.emptyState}><div style={styles.emptyTitle}>SIN REGISTROS</div><div style={styles.emptyText}>CargĂˇ tu peso para empezar a ver la evoluciĂłn.</div></div>
      ) : (
        <>
          {latest && (
            <div style={styles.bwSummaryRow}>
              <div style={styles.bwSummaryItem}><span style={styles.dashLabel}>ACTUAL</span><span style={styles.dashValueSmall}>{latest.weight} kg</span></div>
              {delta !== null && bodyweights.length > 1 && (
                <div style={styles.bwSummaryItem}>
                  <span style={styles.dashLabel}>DESDE EL PRIMER REGISTRO</span>
                  <span style={{ ...styles.dashValueSmall, color: delta < 0 ? '#7a9b6f' : delta > 0 ? '#c65d2e' : undefined }}>{delta > 0 ? '+' : ''}{delta} kg</span>
                </div>
              )}
            </div>
          )}
          <BarChartCard data={chartData} unit="KG" label="EVOLUCIĂ“N DE PESO CORPORAL" />
        </>
      )}
    </div>
  );
}

function BarChartCard({ data, unit, label }) {
  const values = data.map((p) => p.value);
  const maxW = Math.max(1, ...values);
  const minW = Math.min(...values, maxW);
  const range = maxW - minW || 1;
  return (
    <div style={styles.chartCard}>
      <div style={styles.chartHeaderRow}><span style={styles.chartLabel}>{label}</span><span style={styles.chartUnit}>{unit}</span></div>
      <div style={styles.chartArea}>
        {data.map((p, i) => {
          const heightPct = ((p.value - minW) / range) * 70 + 20;
          return (
            <div key={i} style={styles.chartBarWrap}>
              <span style={styles.chartValue}>{p.value}</span>
              <div style={{ ...styles.chartBar, height: `${heightPct}%` }} />
              <span style={styles.chartDate}>{fmtDateShort(p.date)}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

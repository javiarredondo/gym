<script>

    document.addEventListener('DOMContentLoaded', function () {

      box.textContent = 'ERROR:\n\n' + msg + '\n\nSacale una foto a este texto y mandaselo a Claude.';

        box.textContent = 'ERROR:\n\n' + msg + '\n\nSacale una foto a este texto y mandaselo a Claude.';
      }

    showError((e.message || 'Error desconocido') + '\n\nArchivo: ' + (e.filename || '?') + '\nLínea: ' + (e.lineno || '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showError('Promise rechazada: ' + (e.reason && e.reason.message ? e.reason.message : JSON.stringify(e.reason)));

</script>

// ---- Storage helpers (Supabase table "kv_store": key text, value jsonb) + local copy on this device ----
const LS_PREFIX = 'bitacora_';
function lsSet(k, v) { try { localStorage.setItem(LS_PREFIX + k, JSON.stringify(v)); } catch (e) {} }
function lsGet(k) { try { const r = localStorage.getItem(LS_PREFIX + k); return r ? JSON.parse(r) : null; } catch (e) { return null; } }

function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error('Tiempo de espera agotado (la base no respondió)')), ms))]);
}
// IMPORTANT: a failed load must NEVER look like "no data" (otherwise the next save would overwrite real data).
async function loadKey(key, fallback) {
  const { data, error } = await withTimeout(supabaseClient.from('kv_store').select('value').eq('key', key).maybeSingle(), 12000);
  if (error) throw new Error(error.message || String(error));
  return data ? data.value : fallback;
}
async function saveKey(key, value) {
  lsSet(key, value);
  try {
    const { error } = await withTimeout(supabaseClient.from('kv_store').upsert({ key, value }), 12000);
    if (error) throw new Error(error.message || String(error));
    return true;
  } catch (e) {
    console.error('Error guardando', key, e);
    return false;
  }
}
function mergeById(a, b) {
  const seen = new Set(); const out = [];
  [...(a || []), ...(b || [])].forEach((x) => { if (x && !seen.has(x.id)) { seen.add(x.id); out.push(x); } });
  return out.sort((x, y) => (x.date < y.date ? 1 : -1));
}
function mergeByDate(a, b) {
  const map = {};
  [...(b || []), ...(a || [])].forEach((x) => { if (x && x.date) map[x.date] = x; });
  return Object.values(map).sort((x, y) => (x.date < y.date ? -1 : 1));
}

    { ex: BK.puente, dose: '2 × 10-12' },
  ]},
  { id: 'stretch', title: 'MOVILIDAD / ESTIRAMIENTO (OPCIONAL)', subtitle: 'Post entrenamiento o a la noche, para aflojar', items: [
    { ex: BK.rodillasPecho, dose: '2 × 20-30 seg' },
    { ex: BK.twist, dose: '1 × 6 lentas por lado' },
    { ex: BK.nino, dose: '2 × 30 seg' },
    { ex: BK.hamstring, dose: '2 × 30 seg por lado' },
    { ex: BK.flexorCadera, dose: '2 × 30 seg por lado' },
  ]},
];

const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: 'short', year: 'numeric' });
const fmtDateShort = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: 'short' });
const daysBetween = (isoA, isoB) => Math.round((new Date(isoB + 'T00:00:00') - new Date(isoA + 'T00:00:00')) / 86400000);

const fmtPerf = (last) => `${last.weight !== '' && last.weight != null ? last.weight + 'kg × ' : ''}${last.reps !== '' && last.reps != null ? last.reps + ' reps' : ''}`;

const EXERCISE_BY_ID = {};
Object.values(EX).forEach((e) => { EXERCISE_BY_ID[e.id] = e; });
EXERCISE_BY_ID[CORE_EXERCISE.id] = CORE_EXERCISE;

const ALL_EXERCISES_FLAT = Object.values(EX);

function defaultSelectedVariants(dayKey) {
  const map = {};
  ROUTINE[dayKey].exercises.forEach((item) => {
    if (item.type === 'slot') map[item.slotId] = item.options[0].id;
  });
  return map;
}

function emptyLogForDay(dayKey, selectedVariants) {
  const log = {};
  ROUTINE[dayKey].exercises.forEach((item) => {
    const exId = item.type === 'fixed' ? item.ex.id : (selectedVariants[item.slotId] || item.options[0].id);
    log[exId] = Array.from({ length: item.sets }, () => ({ weight: '', reps: '' }));
  });
  log[CORE_EXERCISE.id] = Array.from({ length: CORE_EXERCISE.sets }, () => ({ weight: '', reps: '' }));
  return log;
}

function lastPerformance(sessions, exId) {
  for (const s of sessions) {
    if (s.entries[exId]) {
      const filled = s.entries[exId].filter((x) => x.weight !== '' || x.reps !== '');
      if (filled.length > 0) {
        const maxWeight = Math.max(...filled.map((x) => parseFloat(x.weight) || 0));
        const best = maxWeight > 0 ? (filled.find((x) => parseFloat(x.weight) === maxWeight) || filled[0])
          : filled.reduce((a, b) => ((parseFloat(b.reps) || 0) > (parseFloat(a.reps) || 0) ? b : a), filled[0]);
        return { date: s.date, weight: best.weight, reps: best.reps };
      }
    }
  }
  return null;
}

function GymTracker() {
  const [sessions, setSessions] = useState(null);
  const [bodyweights, setBodyweights] = useState(null);
  const [view, setView] = useState('log');
  const [selectedDay, setSelectedDay] = useState(1);
  const [date, setDate] = useState(todayISO());
  const [selectedVariants, setSelectedVariants] = useState(defaultSelectedVariants(1));
  const [entries, setEntries] = useState(emptyLogForDay(1, defaultSelectedVariants(1)));
  const [note, setNote] = useState('');
  const [saved, setSaved] = useState(false);
  const [expandedHistoryId, setExpandedHistoryId] = useState(null);
  const [editingSessionId, setEditingSessionId] = useState(null);
  const [progressTab, setProgressTab] = useState('dashboard');
  const [progressExerciseId, setProgressExerciseId] = useState(EX.sentadilla.id);
  const [bwInput, setBwInput] = useState('');
  const [bwDate, setBwDate] = useState(todayISO());
  const [configError, setConfigError] = useState(false);
  const [backdays, setBackdays] = useState([]);
  const [loadError, setLoadError] = useState(null);
  const [restoreOffer, setRestoreOffer] = useState(null);
  const [saveWarn, setSaveWarn] = useState(false);
  const [loadTick, setLoadTick] = useState(0);

  useEffect(() => {
    if (SUPABASE_URL.includes('PEGA_ACA') || SUPABASE_ANON_KEY.includes('PEGA_ACA')) {
      setConfigError(true);
      return;
    }
    (async () => {
      setLoadError(null);
      try {
        const [s, bw, bd] = await Promise.all([loadKey('sessions', []), loadKey('bodyweights', []), loadKey('backdays', [])]);
        const sess = s || []; const bws = bw || [];
        const sl = lsGet('sessions') || []; const bl = lsGet('bodyweights') || [];
        if (sess.length === 0 && bws.length === 0 && (sl.length > 0 || bl.length > 0)) {
          if (!lsGet('rescue')) lsSet('rescue', { sessions: sl, bodyweights: bl });
          setRestoreOffer(lsGet('rescue'));
        } else if (sess.length > 0 || bws.length > 0) {
          lsSet('sessions', sess); lsSet('bodyweights', bws);
        }
        lsSet('backdays', bd || []);
        setSessions(sess); setBodyweights(bws); setBackdays(bd || []);
      } catch (e) {
        setLoadError(String((e && e.message) || e));
      }
    })();
  }, [loadTick]);

  const persist = async (key, value) => {
    const ok = await saveKey(key, value);
    setSaveWarn(!ok);
    return ok;
  };

  const handleRestoreLocal = async () => {
    if (!restoreOffer) return;
    const s = mergeById(sessions, restoreOffer.sessions);
    const b = mergeByDate(bodyweights, restoreOffer.bodyweights);
    setSessions(s); setBodyweights(b);
    await persist('sessions', s); await persist('bodyweights', b);
    setRestoreOffer(null);
  };

  const handleImportBackup = async (data) => {
    const s = mergeById(sessions, Array.isArray(data.sessions) ? data.sessions : []);
    const b = mergeByDate(bodyweights, Array.isArray(data.bodyweights) ? data.bodyweights : []);
    const bd = Array.from(new Set([...(backdays || []), ...(Array.isArray(data.backdays) ? data.backdays : [])])).sort();
    setSessions(s); setBodyweights(b); setBackdays(bd);
    await persist('sessions', s); await persist('bodyweights', b); await persist('backdays', bd);
  };

  const handleToggleBackToday = async () => {
    const t = todayISO();
    const next = backdays.includes(t) ? backdays.filter((d) => d !== t) : [...backdays, t].sort();
    setBackdays(next);
    await persist('backdays', next);
  };

  useEffect(() => {
    if (editingSessionId) return;
    const defaults = defaultSelectedVariants(selectedDay);
    setSelectedVariants(defaults);
    setEntries(emptyLogForDay(selectedDay, defaults));
    setNote('');
    setSaved(false);
  }, [selectedDay]);

  const updateSet = (exId, setIdx, field, value) => {
    setEntries((prev) => ({
      ...prev,
      [exId]: prev[exId].map((s, i) => (i === setIdx ? { ...s, [field]: value } : s)),
    }));
    setSaved(false);
  };

  const switchVariant = (slotId, newExId, sets) => {
    setSelectedVariants((prev) => {
      const oldExId = prev[slotId];
      setEntries((prevEntries) => {
        const next = { ...prevEntries };
        if (oldExId && oldExId !== newExId) delete next[oldExId];
        if (!next[newExId]) next[newExId] = Array.from({ length: sets }, () => ({ weight: '', reps: '' }));
        return next;
      });
      return { ...prev, [slotId]: newExId };
    });
    setSaved(false);
  };

  const handleSave = async () => {
    const cleaned = {};
    let hasData = false;
    Object.entries(entries).forEach(([exId, sets]) => {
      const filled = sets.filter((s) => s.weight !== '' || s.reps !== '');
      if (filled.length > 0) { cleaned[exId] = sets; hasData = true; }
    });
    if (!hasData) return;

    let next;
    if (editingSessionId) {
      next = (sessions || []).map((s) => s.id === editingSessionId ? { ...s, date, day: selectedDay, entries: cleaned, note: note.trim() } : s);
    } else {
      const existingIdx = (sessions || []).findIndex((s) => s.date === date && s.day === selectedDay);
      if (existingIdx !== -1) {
        next = (sessions || []).map((s, i) => i === existingIdx ? { ...s, entries: cleaned, note: note.trim() || s.note } : s);
      } else {
        next = [{ id: `${date}-${selectedDay}-${Date.now()}`, date, day: selectedDay, entries: cleaned, note: note.trim() }, ...(sessions || [])];
      }
    }
    next = next.sort((a, b) => (a.date < b.date ? 1 : -1));
    setSessions(next);
    const ok = await persist('sessions', next);
    setSaved(ok);
  };

  const handleEditSession = (session) => {
    setEditingSessionId(session.id);
    setDate(session.date);
    setSelectedDay(session.day);
    const defaults = defaultSelectedVariants(session.day);
    ROUTINE[session.day].exercises.forEach((item) => {
      if (item.type === 'slot') {
        const found = item.options.find((o) => session.entries[o.id]);
        if (found) defaults[item.slotId] = found.id;
      }
    });
    setSelectedVariants(defaults);
    const base = emptyLogForDay(session.day, defaults);
    Object.entries(session.entries).forEach(([exId, sets]) => {
      base[exId] = sets.map((s) => ({ weight: s.weight ?? '', reps: s.reps ?? '' }));
    });
    setEntries(base);
    setNote(session.note || '');
    setSaved(false);
    setView('log');
  };

  const handleDeleteSession = async (sessionId) => {
    const next = (sessions || []).filter((s) => s.id !== sessionId);
    setSessions(next);
    await persist('sessions', next);
    if (editingSessionId === sessionId) {
      setEditingSessionId(null);
      const defaults = defaultSelectedVariants(selectedDay);
      setSelectedVariants(defaults);
      setEntries(emptyLogForDay(selectedDay, defaults));
      setNote('');
    }
  };

  const handleCancelEdit = () => {
    setEditingSessionId(null);
    const defaults = defaultSelectedVariants(selectedDay);
    setSelectedVariants(defaults);
    setEntries(emptyLogForDay(selectedDay, defaults));
    setNote('');
    setSaved(false);
  };

  const handleSaveBodyweight = async () => {
    const val = parseFloat(bwInput);
    if (!val || val <= 0) return;
    const filtered = (bodyweights || []).filter((b) => b.date !== bwDate);
    const next = [...filtered, { date: bwDate, weight: val }].sort((a, b) => (a.date < b.date ? -1 : 1));
    setBodyweights(next);
    await persist('bodyweights', next);
    setBwInput('');
  };

  const progressRows = (sessions || [])
    .filter((s) => s.entries[progressExerciseId])
    .map((s) => ({
      date: s.date,
      maxWeight: Math.max(0, ...s.entries[progressExerciseId].map((x) => parseFloat(x.weight) || 0)),
      maxReps: Math.max(0, ...s.entries[progressExerciseId].map((x) => parseFloat(x.reps) || 0)),
    }))
    .sort((a, b) => (a.date > b.date ? 1 : -1));
  const useReps = progressRows.every((r) => r.maxWeight === 0);
  const progressUnit = useReps ? 'REPS' : 'KG';
  const progressData = progressRows
    .map((r) => ({ date: r.date, value: useReps ? r.maxReps : r.maxWeight }))
    .filter((p) => p.value > 0);

  if (configError) {
    return (
      <div style={styles.loadingScreen}>
        <div style={{ ...styles.loadingText, maxWidth: 320, textAlign: 'center', lineHeight: 1.6 }}>
          FALTA CONFIGURAR SUPABASE.<br/>Editá el archivo index.html y pegá tu URL y ANON KEY donde dice "PEGA_ACA".
        </div>
      </div>
    );
  }

  if (loadError) {
    const hasLocal = (lsGet('sessions') || []).length > 0 || (lsGet('bodyweights') || []).length > 0;
    return (
      <div style={styles.loadingScreen}>
        <div style={{ maxWidth: 340, padding: 20, color: COLORS.paper, fontFamily: "'Oswald', sans-serif" }}>
          <div style={{ fontSize: 22, fontWeight: 700, color: COLORS.ember, marginBottom: 10 }}>NO SE PUDO CONECTAR A LA BASE</div>
          <div style={{ fontSize: 14, lineHeight: 1.6, color: COLORS.paperDim }}>
            Tus datos <b>no se borraron</b>: la app no guarda nada mientras no pueda leerlos (así no pisa lo que ya tenés).<br /><br />
            Causa más probable: Supabase (plan gratis) <b>pausa el proyecto</b> tras ~7 días sin actividad. Entrá a supabase.com/dashboard, abrí el proyecto y tocá <b>Restore / Resume project</b>. Después reintentá acá.
          </div>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: COLORS.paperFaint, marginTop: 12, wordBreak: 'break-word' }}>Detalle: {loadError}</div>
          <button onClick={() => { setSessions(null); setBodyweights(null); setLoadTick((t) => t + 1); }} style={styles.saveButton}>REINTENTAR</button>
          {hasLocal && (
            <button onClick={() => downloadJSON({ app: 'bitacora', exportedAt: new Date().toISOString(), sessions: lsGet('sessions') || [], bodyweights: lsGet('bodyweights') || [], backdays: lsGet('backdays') || [] }, 'bitacora-copia-local.json')}
              style={{ ...styles.saveButton, background: 'none', border: `1px solid ${COLORS.ironLight}`, color: COLORS.paper, marginTop: 10 }}>
              DESCARGAR COPIA LOCAL DE ESTE DISPOSITIVO
            </button>
          )}
        </div>
      </div>
    );
  }

  if (sessions === null || bodyweights === null) {
    return <div style={styles.loadingScreen}><div style={styles.loadingText}>CARGANDO</div></div>;
  }

  return (
    <div style={styles.app}>
      <header style={styles.header}>
        <div>
          <div style={styles.kicker}>REGISTRO DE ENTRENAMIENTO</div>
          <h1 style={styles.title}>BITÁCORA</h1>
        </div>
        <div style={styles.headerRule} />
      </header>

      {saveWarn && (
        <div style={styles.warnBanner}>⚠ No se pudo guardar en la nube (quedó una copia en este dispositivo). Revisá la conexión o si Supabase está pausado y volvé a guardar.</div>
      )}
      {restoreOffer && (
        <div style={styles.warnBanner}>
          La base está vacía pero este dispositivo tiene una copia con {(restoreOffer.sessions || []).length} sesiones.
          <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
            <button onClick={handleRestoreLocal} style={styles.warnBtn}>RESTAURAR COPIA</button>
            <button onClick={() => setRestoreOffer(null)} style={styles.warnBtn}>IGNORAR</button>
          </div>
        </div>
      )}

      <nav style={styles.nav}>
        <NavButton active={view === 'log'} onClick={() => setView('log')} label="Registrar" />
        <NavButton active={view === 'history'} onClick={() => setView('history')} label="Historial" />
        <NavButton active={view === 'progress'} onClick={() => setView('progress')} label="Progreso" />
        <NavButton active={view === 'back'} onClick={() => setView('back')} label="Espalda" />
        <NavButton active={view === 'guide'} onClick={() => setView('guide')} label="Guía" />
      </nav>

      {view === 'log' && (
        <LogView date={date} setDate={setDate} selectedDay={selectedDay} setSelectedDay={setSelectedDay}
          entries={entries} updateSet={updateSet} note={note} setNote={setNote} handleSave={handleSave}
          saved={saved} sessions={sessions} editingSessionId={editingSessionId} handleCancelEdit={handleCancelEdit}
          selectedVariants={selectedVariants} switchVariant={switchVariant} />
      )}
      {view === 'history' && (
        <HistoryView sessions={sessions} expandedHistoryId={expandedHistoryId}
          setExpandedHistoryId={setExpandedHistoryId} handleEditSession={handleEditSession} handleDeleteSession={handleDeleteSession} />
      )}
      {view === 'progress' && (
        <ProgressView progressTab={progressTab} setProgressTab={setProgressTab}
          progressExerciseId={progressExerciseId} setProgressExerciseId={setProgressExerciseId} progressData={progressData} progressUnit={progressUnit}
          sessions={sessions} bodyweights={bodyweights} bwInput={bwInput} setBwInput={setBwInput}
          bwDate={bwDate} setBwDate={setBwDate} handleSaveBodyweight={handleSaveBodyweight} />
      )}
      {view === 'back' && <BackView backdays={backdays} onToggleToday={handleToggleBackToday} />}
      {view === 'guide' && <GuideView sessions={sessions} bodyweights={bodyweights} backdays={backdays} onImport={handleImportBackup} />}
    </div>
  );
}

function NavButton({ active, onClick, label }) {
  return <button onClick={onClick} style={{ ...styles.navButton, ...(active ? styles.navButtonActive : {}) }}>{label}</button>;
}

function ExerciseInfoLinks({ ex }) {
  const gif = EX_GIFS[ex.id];
  const [showGif, setShowGif] = useState(false);
  return (
    <div style={styles.exInfoRow}>
      <div style={styles.exLinksRow}>
        <a href={ex.video} target="_blank" rel="noopener noreferrer" style={styles.exVideoLink}>▶ VER TÉCNICA (VIDEO)</a>
        {gif && (
          <button onClick={() => setShowGif((v) => !v)} style={styles.exGifToggle}>
            {showGif ? '▾ OCULTAR ANIMACIÓN' : '▸ VER ANIMACIÓN'}
          </button>
        )}
      </div>
      {ex.tip && <div style={styles.exTip}>{ex.tip}</div>}
      {gif && showGif && (
        <div style={styles.exGifWrap}>
          <img src={gif} alt={ex.name} loading="lazy" style={styles.exGifImg} />
        </div>
      )}
    </div>
  );
}

function SetInputs({ ex, sets, entries, updateSet }) {
  return (
    <div style={styles.setsGrid}>
      <div style={styles.setsGridHeader}>
        <span></span><span style={styles.setsGridHeaderCell}>KG</span><span style={styles.setsGridHeaderCell}>REPS</span>
      </div>
      {entries[ex.id]?.map((set, setIdx) => (
        <div key={setIdx} style={styles.setRow}>

          <input type="number" inputMode="numeric" value={set.reps} onChange={(e) => updateSet(ex.id, setIdx, 'reps', e.target.value)} placeholder="—" style={styles.setInput} />

      ))}
    </div>
  );
}

function LogView({ date, setDate, selectedDay, setSelectedDay, entries, updateSet, note, setNote, handleSave, saved, sessions, editingSessionId, handleCancelEdit, selectedVariants, switchVariant }) {
  const day = ROUTINE[selectedDay];
  return (
    <div style={styles.section}>
      {editingSessionId && (
        <div style={styles.editBanner}>
          <span>EDITANDO SESIÓN EXISTENTE</span>
          <button onClick={handleCancelEdit} style={styles.editBannerCancel}>Cancelar</button>
        </div>
      )}
      <div style={styles.controlsRow}>
        <div style={styles.dayTabs}>
          {Object.keys(ROUTINE).map(Number).map((d) => (
            <button key={d} disabled={!!editingSessionId} onClick={() => setSelectedDay(d)}
              style={{ ...styles.dayTab, ...(selectedDay === d ? styles.dayTabActive : {}), ...(editingSessionId ? styles.dayTabDisabled : {}) }}>
              {ROUTINE[d].label}
            </button>
          ))}
        </div>
        <input type="date" value={date} disabled={!!editingSessionId} onChange={(e) => setDate(e.target.value)} style={styles.dateInput} />
      </div>

      {selectedDay === 4 && (
        <div style={{ ...styles.guideItemText, marginBottom: 14 }}>Rutina sin gimnasio. Dejá <b>KG</b> vacío si es peso corporal (podés poner kg si usás mochila o mancuernas) y cargá solo las <b>reps</b>.</div>
      )}
      <div style={styles.exerciseList}>
        {day.exercises.map((item, idx) => {
          if (item.type === 'fixed') {
            const ex = item.ex;
            const last = lastPerformance(sessions, ex.id);
            return (
              <div key={ex.id} style={styles.exerciseCard}>
                <div style={styles.exerciseHeader}>
                  <span style={styles.exerciseNum}>{String(idx + 1).padStart(2, '0')}</span>
                  <div style={{ flex: 1 }}>
                    <div style={styles.exerciseName}>{ex.name}</div>
                    <div style={styles.exerciseMeta}>{item.sets} series · {item.repRange} reps</div>
                  </div>
                </div>
                <ExerciseInfoLinks ex={ex} />
                {last && (
                  <div style={styles.lastPerf}>
                    <span style={styles.lastPerfLabel}>ÚLTIMA VEZ</span>
                    <span style={styles.lastPerfValue}>{fmtPerf(last)} · {fmtDateShort(last.date)}</span>
                  </div>
                )}
                <SetInputs ex={ex} sets={item.sets} entries={entries} updateSet={updateSet} />
              </div>
            );
          }
          const currentExId = selectedVariants[item.slotId];
          const currentEx = item.options.find((o) => o.id === currentExId) || item.options[0];
          const last = lastPerformance(sessions, currentEx.id);
          return (
            <div key={item.slotId} style={styles.exerciseCard}>
              <div style={styles.exerciseHeader}>
                <span style={styles.exerciseNum}>{String(idx + 1).padStart(2, '0')}</span>
                <div style={{ flex: 1 }}>
                  <div style={styles.exerciseName}>{currentEx.name}</div>
                  <div style={styles.exerciseMeta}>{item.sets} series · {item.repRange} reps</div>
                </div>
              </div>
              <div style={styles.variantTabs}>
                {item.options.map((opt) => (
                  <button key={opt.id} onClick={() => switchVariant(item.slotId, opt.id, item.sets)}
                    style={{ ...styles.variantTab, ...(opt.id === currentExId ? styles.variantTabActive : {}) }}>
                    {opt.name}
                  </button>
                ))}
              </div>
              <ExerciseInfoLinks ex={currentEx} />
              {last && (
                <div style={styles.lastPerf}>
                  <span style={styles.lastPerfLabel}>ÚLTIMA VEZ</span>
                  <span style={styles.lastPerfValue}>{fmtPerf(last)} · {fmtDateShort(last.date)}</span>
                </div>
              )}
              <SetInputs ex={currentEx} sets={item.sets} entries={entries} updateSet={updateSet} />
            </div>
          );
        })}

        <div style={{ ...styles.exerciseCard, ...styles.coreCard }}>
          <div style={styles.exerciseHeader}>
            <span style={styles.exerciseNum}>+</span>
            <div style={{ flex: 1 }}>
              <div style={styles.exerciseName}>{CORE_EXERCISE.name}</div>
              <div style={styles.exerciseMeta}>opcional · series x reps o segundos</div>
            </div>
          </div>
          <ExerciseInfoLinks ex={CORE_EXERCISE} />
          <div style={styles.setsGrid}>
            <div style={styles.setsGridHeader}>
              <span></span><span style={styles.setsGridHeaderCell}>EJERCICIO</span><span style={styles.setsGridHeaderCell}>REPS/SEG</span>
            </div>
            {entries[CORE_EXERCISE.id]?.map((set, setIdx) => (
              <div key={setIdx} style={styles.setRow}>
                <span style={styles.setLabel}>Serie {setIdx + 1}</span>
                <input type="text" value={set.weight} onChange={(e) => updateSet(CORE_EXERCISE.id, setIdx, 'weight', e.target.value)} placeholder="ej: plancha" style={styles.setInput} />
                <input type="text" value={set.reps} onChange={(e) => updateSet(CORE_EXERCISE.id, setIdx, 'reps', e.target.value)} placeholder="ej: 30s" style={styles.setInput} />
              </div>
            ))}
          </div>
        </div>
      </div>

      <div style={styles.noteCard}>
        <span style={styles.noteLabel}>NOTA DE LA SESIÓN (opcional)</span>
        <textarea value={note} onChange={(e) => setNote(e.target.value)} placeholder="Ej: me costó la última serie, subir peso próxima vez..." style={styles.noteInput} rows={2} />
      </div>

      <button onClick={handleSave} style={styles.saveButton}>
        {saved ? `✓ ${editingSessionId ? 'CAMBIOS GUARDADOS' : 'GUARDADO'}` : (editingSessionId ? 'GUARDAR CAMBIOS' : 'GUARDAR SESIÓN')}
      </button>
    </div>
  );

function DashboardTab({ sessions }) {
  if (sessions.length === 0) {
    return <div style={styles.emptyState}><div style={styles.emptyTitle}>SIN DATOS</div><div style={styles.emptyText}>Registrá sesiones para ver tu resumen acá.</div></div>;
  }
  const totalSessions = sessions.length;
  const today = todayISO();
  const last7 = sessions.filter((s) => { const d = daysBetween(s.date, today); return d <= 7 && d >= 0; }).length;
  let totalSets = 0;
  sessions.forEach((s) => Object.values(s.entries).forEach((sets) => { totalSets += sets.filter((x) => x.weight !== '' || x.reps !== '').length; }));
  const lastSession = sessions[0];
  const daysSinceLast = daysBetween(lastSession.date, today);

  let streakWeeks = 0;
  {
    const sorted = [...sessions].map((s) => s.date).sort((a, b) => (a < b ? 1 : -1));
    let cursor = new Date(today + 'T00:00:00');
    for (let w = 0; w < 52; w++) {
      const weekStart = new Date(cursor); weekStart.setDate(weekStart.getDate() - 7);
      const hasSession = sorted.some((d) => { const dd = new Date(d + 'T00:00:00'); return dd > weekStart && dd <= cursor; });
      if (hasSession) { streakWeeks++; cursor = weekStart; } else break;
    }
  }

  return (
    <div style={styles.dashGrid}>
      <div style={styles.dashCard}><span style={styles.dashValue}>{totalSessions}</span><span style={styles.dashLabel}>SESIONES TOTALES</span></div>
      <div style={styles.dashCard}><span style={styles.dashValue}>{last7}</span><span style={styles.dashLabel}>ÚLTIMOS 7 DÍAS</span></div>
      <div style={styles.dashCard}><span style={styles.dashValue}>{streakWeeks}</span><span style={styles.dashLabel}>SEMANAS SEGUIDAS</span></div>
      <div style={styles.dashCard}><span style={styles.dashValueSmall}>{totalSets}</span><span style={styles.dashLabel}>SERIES REGISTRADAS</span></div>
      <div style={{ ...styles.dashCard, gridColumn: '1 / -1' }}>
        <span style={styles.dashLabel}>ÚLTIMA SESIÓN</span>
        <span style={styles.dashValueSmall}>{ROUTINE[lastSession.day].label} · {fmtDate(lastSession.date)}{daysSinceLast > 0 && <span style={styles.dashSubtle}> ({daysSinceLast} día{daysSinceLast !== 1 ? 's' : ''} atrás)</span>}</span>
      </div>
    </div>
  );
}

function BarChartCard({ data, unit, label }) {
  const values = data.map((p) => p.value);
  const maxW = Math.max(1, ...values);
  const minW = Math.min(...values, maxW);
  const range = maxW - minW || 1;
  return (
    <div style={styles.chartCard}>
      <div style={styles.chartHeaderRow}><span style={styles.chartLabel}>{label}</span><span style={styles.chartUnit}>{unit}</span></div>
      <div style={styles.chartArea}>
        {data.map((p, i) => {
          const heightPct = ((p.value - minW) / range) * 70 + 20;
          return (
            <div key={i} style={styles.chartBarWrap}>
              <span style={styles.chartValue}>{p.value}</span>
              <div style={{ ...styles.chartBar, height: `${heightPct}%` }} />
              <span style={styles.chartDate}>{fmtDateShort(p.date)}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function BackupCard({ sessions, bodyweights, backdays, onImport }) {
  const [msg, setMsg] = useState('');
  const doExport = () => {
    downloadJSON({ app: 'bitacora', version: 1, exportedAt: new Date().toISOString(), sessions, bodyweights, backdays }, `bitacora-backup-${todayISO()}.json`);
    setMsg('Copia descargada. Guardala en Drive/iCloud o mandatela por mail.');
  };
  const doImport = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || (!Array.isArray(data.sessions) && !Array.isArray(data.bodyweights))) throw new Error('formato');
        await onImport(data);
        setMsg('Copia importada y combinada con tus datos actuales (sin duplicar).');
      } catch (err) { setMsg('El archivo no parece una copia válida de Bitácora.'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };
  return (
    <GuideCard title="COPIA DE SEGURIDAD" subtitle="Tus datos son tuyos: descargalos cada tanto">
      <GuideItem>Descargá una copia cada 2-4 semanas. Si algún día la base se pierde, la importás y listo.</GuideItem>
      <GuideItem>Sesiones: {sessions.length} · Registros de peso: {bodyweights.length}</GuideItem>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
        <button onClick={doExport} style={styles.warnBtn}>DESCARGAR COPIA</button>
        <label style={{ ...styles.warnBtn, display: 'inline-block' }}>IMPORTAR COPIA<input type="file" accept="application/json,.json" onChange={doImport} style={{ display: 'none' }} /></label>
      </div>
      {msg && <div style={styles.guideItemText}>{msg}</div>}
    </GuideCard>
  );
}
